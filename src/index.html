<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelex</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <!-- Procedural starfield behind everything — see orb/starfield.js -->
    <canvas id="starfield"></canvas>
    <!-- Reactive orb (Canvas 2D) — see orb/blob.js -->
    <canvas id="blobCanvas"></canvas>

    <div class="top-bar">
        <div class="left" id="clock">--:--:--</div>
        <div class="center">K.E.L.E.X.</div>
        <div class="right">
            <button id="btnSettingsGear" class="gear-btn" title="Settings">⚙</button>
            <span id="statusText">STANDBY</span>
            <div class="status-dot" id="statusDot"></div>
        </div>
    </div>

    <div class="blob-click-zone" id="reactorCore" title="Click to cycle state"></div>
    <div class="state-label" id="coreLabel">ACTIVATE</div>

    <div class="output-panel">
        <div class="transcript" id="transcript"></div>
        <div class="response" id="response">Neural link offline, sir.</div>
    </div>

    <div class="sys-status">UPLINK: <span id="sysInfo">offline</span></div>

    <!-- Text chat overlay — Ctrl/Cmd+K to toggle. -->
    <div class="text-chat-overlay" id="textChatOverlay">
        <div class="text-chat-panel">
            <div class="text-chat-messages" id="textChatMessages"></div>
            <div class="text-chat-toolbar">
                <span class="text-chat-status" id="textChatStatus">○ STANDBY</span>
                <span class="text-chat-actions">
                    <button class="text-chat-action" id="btnTextChatClear" title="Clear conversation">CLEAR</button>
                    <button class="text-chat-action" id="btnTextChatClose" title="Close (Esc)">✕</button>
                </span>
            </div>
            <div class="text-chat-input-row">
                <textarea class="text-chat-input" id="textChatInput" rows="1"
                    placeholder="Speak your mind, sir…" autocomplete="off" spellcheck="false"></textarea>
                <button class="text-chat-send" id="btnTextChatSend" title="Send (Enter)">▶</button>
            </div>
            <div class="text-chat-hint">Enter to send · Shift+Enter for newline · Esc to close · Ctrl/Cmd+K to toggle</div>
        </div>
    </div>

    <!-- Settings panel — ⚙ button or tray "Settings…" -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel">
            <div class="settings-title">HERMES GATEWAY</div>

            <label class="settings-field">
                <span>Gateway URL</span>
                <input id="setGatewayUrl" type="text" autocomplete="off" spellcheck="false"
                    placeholder="https://hermes-gateway.akikp.in">
            </label>

            <label class="settings-field">
                <span>Username</span>
                <input id="setUsername" type="text" autocomplete="off" spellcheck="false"
                    placeholder="admin">
            </label>

            <label class="settings-field">
                <span>Password</span>
                <input id="setPassword" type="password" autocomplete="off" spellcheck="false"
                    placeholder="Leave blank to keep current">
            </label>

            <div class="settings-divider"></div>
            <div class="settings-title">APP</div>

            <label class="settings-field">
                <span>Global hotkey</span>
                <input id="setHotkey" type="text" autocomplete="off" spellcheck="false"
                    placeholder="CmdOrCtrl+Shift+J">
            </label>

            <label class="settings-check">
                <input id="setAutostart" type="checkbox"> Start at login
            </label>

            <label class="settings-check">
                <input id="setWake" type="checkbox"> Wake word — say "Kelex" (always-on mic)
            </label>

            <div class="settings-actions">
                <button class="control-btn" id="btnSettingsCancel">Cancel</button>
                <button class="control-btn settings-save" id="btnSettingsSave">Save</button>
            </div>
            <div class="settings-status" id="settingsStatus"></div>
        </div>
    </div>

    <!-- Orb renderers expose window.blobAPI; load before app wiring. -->
    <script src="./orb/starfield.js"></script>
    <script src="./orb/blob.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
