[package]
name = "kelex-talk"
version = "0.2.0"
description = "Kelex — Hermes Agent Desktop Client"
authors = ["you"]
edition = "2021"
default-run = "kelex-talk"

[lib]
name = "kelex_talk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Wake-word engine: native mic capture (cpal) + WAV encode (hound).
cpal = "0.18"
hound = "3"
# HTTP client for wake-word POST to Hermes Gateway /api/wake-detect
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "cookies"] }
base64 = "0.22"
url = "2"
urlencoding = "2"
tokio-tungstenite = { version = "0.24", features = ["__rustls-tls"] }
rustls-native-certs = "0.8"
# Pin a single Rustls crypto provider. Both reqwest and the WS proxy share it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
tokio = { version = "1", features = ["net", "rt", "sync", "macros"] }
